name: CLI CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: ah-linux-x86_64
          - os: macos-15-intel
            asset: ah-macos-x86_64
          - os: macos-latest
            asset: ah-macos-arm64
          - os: windows-latest
            asset: ah-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: 1.94.1
          components: clippy,rustfmt
      - name: Fetch locked source inputs
        shell: bash
        run: ./scripts/sync-upstream.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Validate parser fixtures with the pinned TypeScript compiler
        run: |
          npm ci --prefix tests/typescript --ignore-scripts --no-audit --no-fund
          npm test --prefix tests/typescript
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release --bin ah
      - name: Check canonical output contracts
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/validate-contracts.py target/release/ah${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Check source launcher and custom-prefix installer
        if: runner.os != 'Windows'
        run: python3 scripts/verify-install.py target/release/ah
      - name: Record candidate performance evidence
        if: runner.os == 'Linux'
        run: python3 scripts/benchmark.py target/release/ah --output dist/benchmark-linux.json
      - name: Collect dependency and Rust library attribution
        run: python scripts/dependency-notices.py --output notices/THIRD_PARTY_NOTICES.txt
      - name: Verify packaging failure cases
        run: python scripts/test-artifacts.py target/release/ah${{ runner.os == 'Windows' && '.exe' || '' }} notices/THIRD_PARTY_NOTICES.txt
      - name: Package binary and provenance
        shell: bash
        run: |
          mkdir -p dist
          if [ -f target/release/ah.exe ]; then cp target/release/ah.exe "dist/${{ matrix.asset }}"; else cp target/release/ah "dist/${{ matrix.asset }}"; fi
          python scripts/package-candidate.py "dist/${{ matrix.asset }}" --commit "${{ github.sha }}" --notices notices/THIRD_PARTY_NOTICES.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
  installed:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: ah-linux-x86_64
          - os: macos-15-intel
            asset: ah-macos-x86_64
          - os: macos-latest
            asset: ah-macos-arm64
          - os: windows-latest
            asset: ah-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.asset }}
          path: downloaded
      - name: Verify downloaded asset outside checkout
        shell: bash
        run: |
          chmod +x "downloaded/${{ matrix.asset }}"
          python scripts/package-candidate.py "downloaded/${{ matrix.asset }}.zip" --verify-archive
          python scripts/package-candidate.py "downloaded/${{ matrix.asset }}" --verify
          python scripts/verify-candidate.py "downloaded/${{ matrix.asset }}" --report "evidence/${{ matrix.asset }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.asset }}
          path: evidence/*
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.1
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --json > dependency-audit.json
      - run: python3 scripts/dependency-report.py --output dependency-licenses.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-evidence
          path: dependency-*.json
