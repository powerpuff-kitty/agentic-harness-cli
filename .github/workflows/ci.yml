name: CLI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: powerpuff-kitty/agentic-harness
          ref: 831ea9e773ce1e466e07dda0dd3ddc9792c6a892
          path: upstream/agentic-harness
      - uses: actions/checkout@v4
        with:
          repository: powerpuff-kitty/agentic-harness-agents
          ref: 56ff0a2d85a04c1ab50cbdd46b0b451398c35640
          path: upstream/agentic-harness-agents
      - run: sh ./scripts/prepare-upstream.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo check --all-targets
      - run: cargo test --all-targets
      - run: cargo run --quiet -- validate .
      - run: cargo run --quiet -- harness-audit upstream/agentic-harness/base
      - run: cargo run --quiet -- audit . > /tmp/audit.json || test $? -eq 1
      - run: cargo run --quiet --bin ah-agentic -- audit . > /tmp/agentic-audit.json
      - run: cargo run --quiet --bin ah-agentic -- models . > /tmp/models.json
      - run: test "$(python3 -c 'import json; print(len(json.load(open("/tmp/models.json"))["models"]))')" -ge 2
      - run: ./ah agentic context . > /tmp/context.json
      - run: ./ah agentic improve . > /tmp/improve.json
