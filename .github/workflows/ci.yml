name: CLI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: powerpuff-kitty/agentic-harness
          ref: f507ad0adfe988d1e464cc67c67a505b9d174fe6
          path: upstream/agentic-harness
      - uses: actions/checkout@v4
        with:
          repository: powerpuff-kitty/agentic-harness-agents
          ref: 01838622d970841307dacfb9a3e90f9a4d71631a
          path: upstream/agentic-harness-agents
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --all-targets
      - run: cargo test --all-targets
      - run: cargo run --quiet -- validate .
      - run: cargo run --quiet -- harness-audit upstream/agentic-harness/boilerplates/base
      - run: cargo run --quiet -- audit . > /tmp/audit.json || test $? -eq 1
