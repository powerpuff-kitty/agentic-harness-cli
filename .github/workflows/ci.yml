name: CLI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: powerpuff-kitty/agentic-harness
          ref: c8e879787803edb5dc431511725392fe4bda9dbe
          path: upstream/agentic-harness
      - uses: actions/checkout@v4
        with:
          repository: powerpuff-kitty/agentic-harness-agents
          ref: 7072d8131cf062212ce05e69dc62563ce4758e94
          path: upstream/agentic-harness-agents
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo check --all-targets
      - run: cargo test --all-targets
      - run: cargo run --quiet -- validate .
      - run: cargo run --quiet -- harness-audit upstream/agentic-harness/base
      - run: cargo run --quiet -- audit . > /tmp/audit.json || test $? -eq 1
