name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: ah-linux-x86_64
          - os: macos-15-intel
            asset: ah-macos-x86_64
          - os: macos-latest
            asset: ah-macos-arm64
          - os: windows-latest
            asset: ah-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: powerpuff-kitty/agentic-harness
          ref: c8e879787803edb5dc431511725392fe4bda9dbe
          path: upstream/agentic-harness
      - uses: actions/checkout@v4
        with:
          repository: powerpuff-kitty/agentic-harness-agents
          ref: 7072d8131cf062212ce05e69dc62563ce4758e94
          path: upstream/agentic-harness-agents
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo build --release
      - shell: bash
        run: |
          mkdir -p dist
          if [ -f target/release/ah.exe ]; then cp target/release/ah.exe "dist/${{ matrix.asset }}"; else cp target/release/ah "dist/${{ matrix.asset }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create '${{ github.ref_name }}' dist/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
