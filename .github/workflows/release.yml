name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: ah-linux-x86_64
          - os: macos-15-intel
            asset: ah-macos-x86_64
          - os: macos-latest
            asset: ah-macos-arm64
          - os: windows-latest
            asset: ah-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: powerpuff-kitty/agentic-harness
          ref: c8e879787803edb5dc431511725392fe4bda9dbe
          path: upstream/agentic-harness
      - uses: actions/checkout@v4
        with:
          repository: powerpuff-kitty/agentic-harness-agents
          ref: 56ff0a2d85a04c1ab50cbdd46b0b451398c35640
          path: upstream/agentic-harness-agents
      - uses: actions/checkout@v4
        with:
          repository: powerpuff-kitty/agentic-harness
          ref: 831ea9e773ce1e466e07dda0dd3ddc9792c6a892
          path: upstream/agentic-harness-registry
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo build --release
      - shell: bash
        run: |
          mkdir -p dist
          if [ -f target/release/ah.exe ]; then cp target/release/ah.exe "dist/${{ matrix.asset }}"; else cp target/release/ah "dist/${{ matrix.asset }}"; fi
          if [ -f target/release/ah-agentic.exe ]; then cp target/release/ah-agentic.exe "dist/${{ matrix.asset }}-agentic.exe"; else cp target/release/ah-agentic "dist/${{ matrix.asset }}-agentic"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create '${{ github.ref_name }}' dist/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
