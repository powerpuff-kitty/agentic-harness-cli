[package]
name = "agentic-harness-cli"
version = "0.1.0"
edition = "2024"
description = "Native Agentic Harness CLI"
license = "MIT"
build = "build.rs"
default-run = "ah"

[[bin]]
name = "ah"
path = "src/main.rs"

[[bin]]
name = "ah-agentic"
path = "src/bin/ah-agentic.rs"

[[bin]]
name = "ah-design"
path = "src/bin/ah-design.rs"

[[bin]]
name = "ah-architecture"
path = "src/bin/ah-architecture.rs"

[dependencies]
include_dir = "0.7"
serde_json = "1"
serde_yaml_ng = "0.10"
ignore = "0.4"
regex = "1"
oxc_allocator = "=0.139.0"
oxc_parser = "=0.139.0"
oxc_ast = "=0.139.0"
oxc_ast_visit = "=0.139.0"
oxc_span = "=0.139.0"
tempfile = "3"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
