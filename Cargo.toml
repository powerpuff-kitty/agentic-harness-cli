[package]
name = "agentic-harness-cli"
version = "0.1.0"
edition = "2024"
description = "Native Agentic Harness CLI"
license = "MIT"
build = "build.rs"
default-run = "ah"

[[bin]]
name = "ah"
path = "src/main.rs"

[[bin]]
name = "ah-agentic"
path = "src/bin/ah-agentic.rs"

[[bin]]
name = "ah-design"
path = "src/bin/ah-design.rs"

[[bin]]
name = "ah-architecture"
path = "src/bin/ah-architecture.rs"

[dependencies]
include_dir = "0.7"
serde_json = "1"
serde_yaml_ng = "0.10"
ignore = "0.4"
regex = "1"
oxc_allocator = "=0.139.0"
oxc_parser = "=0.139.0"
oxc_ast = "=0.139.0"
oxc_ast_visit = "=0.139.0"
oxc_span = "=0.139.0"
tempfile = "3"
sha2 = "0.10"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "json"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
